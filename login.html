<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام الغياب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-box">
    <img src="https://f.top4top.io/p_3564d7ot40.jpg" alt="شعار المدرسة" class="login-logo">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button id="login-btn" class="login-btn">تسجيل الدخول</button>
    <p class="hint">استخدم أي اسم مستخدم وكلمة مرور لتجربة النظام</p>
  </div>

  <script>
    document.getElementById("login-btn").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if(!username || !password) {
        alert("من فضلك أدخل اسم المستخدم وكلمة المرور.");
        return;
      }
      localStorage.setItem("loggedInUser", username);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
